# Relever les jours chaque nuit, pour que les sommets grandissent seuls.
# À copier dans .github/workflows/ si vos créations vivent dans CE dépôt (dépôt « . » dans oeuvre.json) :
# l'action ne voit pas les dépôts de votre ordinateur.
name: Relevé de la nuit
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  relever:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # tout l'historique : les jours anciens comptent
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node relever.mjs
      - run: |
          git config user.name "relevé"
          git config user.email "releve@users.noreply.github.com"
          git add jours.json
          git diff --cached --quiet || git commit -m "Relevé du $(date +%F)"
          git push
